<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    
    <linearGradient id="sagaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    
    <linearGradient id="failGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    
    <linearGradient id="compensateGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="400" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="100" fill="#06b6d4" opacity="0.05"/>
  <circle cx="350" cy="350" r="120" fill="#f59e0b" opacity="0.05"/>
  
  <!-- Title -->
  <text x="200" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white">
    Saga Pattern
  </text>
  <text x="200" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
    Distributed Transactions in .NET 10
  </text>
  
  <!-- Saga Flow Diagram -->
  <g transform="translate(30, 85)">
    <!-- Orchestrator in center -->
    <rect x="130" y="20" width="80" height="40" rx="6" fill="url(#sagaGradient)" filter="url(#glow)"/>
    <text x="170" y="36" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="white">Orchestrator</text>
    <text x="170" y="50" text-anchor="middle" font-family="Monaco, monospace" font-size="7" fill="rgba(255,255,255,0.7)">State Machine</text>
    
    <!-- Services around it -->
    <!-- Stock Service -->
    <rect x="20" y="90" width="70" height="35" rx="5" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="55" y="103" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="#06b6d4">📦 Stock</text>
    <text x="55" y="116" text-anchor="middle" font-family="Monaco, monospace" font-size="7" fill="#64748b">Service</text>
    
    <!-- Payment Service -->
    <rect x="130" y="90" width="80" height="35" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="170" y="103" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="#10b981">💳 Payment</text>
    <text x="170" y="116" text-anchor="middle" font-family="Monaco, monospace" font-size="7" fill="#64748b">Service</text>
    
    <!-- Shipping Service -->
    <rect x="250" y="90" width="70" height="35" rx="5" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="285" y="103" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="#8b5cf6">🚚 Ship</text>
    <text x="285" y="116" text-anchor="middle" font-family="Monaco, monospace" font-size="7" fill="#64748b">Service</text>
    
    <!-- Connection arrows -->
    <path d="M 130 50 L 75 90" stroke="#06b6d4" stroke-width="1.5" fill="none" marker-end="url(#arrowCyan)"/>
    <path d="M 170 60 L 170 90" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
    <path d="M 210 50 L 265 90" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>
  </g>
  
  <!-- State Flow -->
  <g transform="translate(30, 220)">
    <text x="170" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">SAGA STATES</text>
    
    <!-- States -->
    <rect x="5" y="15" width="60" height="28" rx="4" fill="url(#sagaGradient)"/>
    <text x="35" y="33" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="white">Pending</text>
    
    <rect x="85" y="15" width="60" height="28" rx="4" fill="url(#successGradient)"/>
    <text x="115" y="33" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="white">Processing</text>
    
    <rect x="165" y="15" width="60" height="28" rx="4" fill="url(#compensateGradient)"/>
    <text x="195" y="33" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="white">Compensate</text>
    
    <rect x="245" y="15" width="60" height="28" rx="4" fill="url(#successGradient)"/>
    <text x="275" y="33" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="white">Completed</text>
    
    <rect x="165" y="55" width="60" height="28" rx="4" fill="url(#failGradient)"/>
    <text x="195" y="73" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="white">Failed</text>
    
    <!-- Arrows between states -->
    <path d="M 65 29 L 85 29" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <polygon points="83,25 90,29 83,33" fill="#64748b"/>
    
    <path d="M 145 29 L 165 29" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <polygon points="163,25 170,29 163,33" fill="#64748b"/>
    
    <path d="M 225 29 L 245 29" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <polygon points="243,25 250,29 243,33" fill="#64748b"/>
    
    <path d="M 195 43 L 195 55" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <polygon points="191,53 195,60 199,53" fill="#64748b"/>
  </g>
  
  <!-- Features -->
  <g transform="translate(30, 310)">
    <rect width="340" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
      <tspan fill="#10b981">✓</tspan> Automatic Compensation
    </text>
    <text x="20" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
      <tspan fill="#10b981">✓</tspan> State Machine Orchestration
    </text>
    <text x="180" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
      <tspan fill="#06b6d4">✓</tspan> Outbox Pattern
    </text>
    <text x="180" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
      <tspan fill="#06b6d4">✓</tspan> Reliable Messaging
    </text>
  </g>
  
  <!-- Tech badges -->
  <g transform="translate(70, 380)">
    <rect x="0" y="0" width="55" height="16" rx="3" fill="#512bd4"/>
    <text x="27" y="11" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="white">.NET 10</text>
    
    <rect x="63" y="0" width="70" height="16" rx="3" fill="#ff6600"/>
    <text x="98" y="11" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="white">RabbitMQ</text>
    
    <rect x="141" y="0" width="75" height="16" rx="3" fill="#06b6d4"/>
    <text x="178" y="11" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="white">MassTransit</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles (no filter) -->
  <circle cx="100" cy="100" r="200" fill="#06b6d4" opacity="0.08"/>
  <circle cx="1100" cy="530" r="250" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="white">Saga Pattern for Distributed Transactions</text>
  <text x="600" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Orchestration, Compensation &amp; Reliable Messaging in .NET 10</text>
  
  <!-- Saga Orchestration Diagram -->
  <g transform="translate(80, 160)">
    <!-- Central Orchestrator -->
    <rect x="150" y="30" width="180" height="80" rx="10" fill="#06b6d4"/>
    <text x="240" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">🎯 Orchestrator</text>
    <text x="240" y="82" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">State Machine</text>
    <text x="240" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.6)">Coordinates Saga Flow</text>
    
    <!-- Services -->
    <rect x="0" y="160" width="140" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="70" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06b6d4">📦 Stock Service</text>
    <text x="70" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Reserve / Release</text>
    
    <rect x="170" y="160" width="140" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="240" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">💳 Payment Service</text>
    <text x="240" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Process / Refund</text>
    
    <rect x="340" y="160" width="140" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="410" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#8b5cf6">🚚 Shipping Service</text>
    <text x="410" y="210" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Arrange / Cancel</text>
    
    <!-- Connection lines -->
    <path d="M 200 110 L 70 160" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    <path d="M 240 110 L 240 160" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    <path d="M 280 110 L 410 160" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    
    <text x="240" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">ORCHESTRATION-BASED SAGA</text>
  </g>
  
  <!-- State Machine Flow -->
  <g transform="translate(600, 160)">
    <text x="260" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">SAGA STATE MACHINE</text>
    
    <!-- States -->
    <rect x="40" y="50" width="90" height="45" rx="6" fill="#06b6d4"/>
    <text x="85" y="78" text-anchor="middle" font-family="monospace" font-size="11" fill="white">Pending</text>
    
    <rect x="170" y="50" width="100" height="45" rx="6" fill="#06b6d4"/>
    <text x="220" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Reserving</text>
    <text x="220" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Stock</text>
    
    <rect x="310" y="50" width="100" height="45" rx="6" fill="#10b981"/>
    <text x="360" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Processing</text>
    <text x="360" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Payment</text>
    
    <rect x="450" y="50" width="100" height="45" rx="6" fill="#8b5cf6"/>
    <text x="500" y="70" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Arranging</text>
    <text x="500" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Shipping</text>
    
    <!-- Arrows between states -->
    <path d="M 130 72 L 165 72" stroke="#64748b" stroke-width="2" fill="none"/>
    <polygon points="163,67 175,72 163,77" fill="#64748b"/>
    
    <path d="M 270 72 L 305 72" stroke="#64748b" stroke-width="2" fill="none"/>
    <polygon points="303,67 315,72 303,77" fill="#64748b"/>
    
    <path d="M 410 72 L 445 72" stroke="#64748b" stroke-width="2" fill="none"/>
    <polygon points="443,67 455,72 443,77" fill="#64748b"/>
    
    <!-- Completed -->
    <rect x="450" y="130" width="100" height="45" rx="6" fill="#10b981"/>
    <text x="500" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="white">✓ Completed</text>
    
    <path d="M 500 95 L 500 125" stroke="#10b981" stroke-width="2" fill="none"/>
    <polygon points="495,123 500,135 505,123" fill="#10b981"/>
    
    <!-- Compensating branch -->
    <rect x="310" y="130" width="100" height="45" rx="6" fill="#f59e0b"/>
    <text x="360" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="white">Compensating</text>
    
    <!-- Failed -->
    <rect x="310" y="210" width="100" height="45" rx="6" fill="#ef4444"/>
    <text x="360" y="238" text-anchor="middle" font-family="monospace" font-size="11" fill="white">✗ Failed</text>
    
    <!-- Compensation flow arrows -->
    <path d="M 360 95 L 360 125" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" fill="none"/>
    <polygon points="355,123 360,135 365,123" fill="#f59e0b"/>
    <text x="385" y="115" font-family="monospace" font-size="8" fill="#f59e0b">payment failed</text>
    
    <path d="M 360 175 L 360 205" stroke="#ef4444" stroke-width="2" fill="none"/>
    <polygon points="355,203 360,215 365,203" fill="#ef4444"/>
    <text x="380" y="195" font-family="monospace" font-size="8" fill="#64748b">rollback</text>
  </g>
  
  <!-- Outbox Pattern -->
  <g transform="translate(80, 450)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">OUTBOX PATTERN - RELIABLE MESSAGING</text>
    
    <rect x="0" y="20" width="160" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#06b6d4">1. Save State</text>
    <text x="80" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Same Transaction</text>
    
    <rect x="200" y="20" width="160" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="280" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#10b981">2. Store Message</text>
    <text x="280" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Outbox Table</text>
    
    <rect x="400" y="20" width="160" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="480" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#f59e0b">3. Publish Later</text>
    <text x="480" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Background Process</text>
    
    <!-- Arrows -->
    <path d="M 160 45 L 195 45" stroke="#64748b" stroke-width="2" fill="none"/>
    <polygon points="193,40 205,45 193,50" fill="#64748b"/>
    
    <path d="M 360 45 L 395 45" stroke="#64748b" stroke-width="2" fill="none"/>
    <polygon points="393,40 405,45 393,50" fill="#64748b"/>
  </g>
  
  <!-- Tech Stack -->
  <g transform="translate(700, 470)">
    <rect x="0" y="0" width="100" height="35" rx="5" fill="#512bd4"/>
    <text x="50" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">.NET 10</text>
    
    <rect x="115" y="0" width="120" height="35" rx="5" fill="#06b6d4"/>
    <text x="175" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">MassTransit</text>
    
    <rect x="250" y="0" width="110" height="35" rx="5" fill="#ff6600"/>
    <text x="305" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">RabbitMQ</text>
    
    <rect x="375" y="0" width="110" height="35" rx="5" fill="#cc2927"/>
    <text x="430" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">SQL Server</text>
  </g>
  
  <!-- Tagline -->
  <text x="600" y="595" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">Orchestration • Automatic Compensation • Exactly-Once Delivery • Production-Ready</text>
</svg>
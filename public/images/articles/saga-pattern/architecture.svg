<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    
    <linearGradient id="orchestratorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    
    <linearGradient id="brokerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  
  <!-- Grid -->
  <g opacity="0.03">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Saga Architecture Overview</text>
  
  <!-- API Layer -->
  <g transform="translate(350, 60)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="url(#apiGradient)" filter="url(#glow)"/>
    <text x="50" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">🌐 API</text>
    <text x="50" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">HTTP Gateway</text>
  </g>
  
  <!-- Message Broker -->
  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="url(#brokerGradient)" filter="url(#glow)"/>
    <text x="100" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">🐰 RabbitMQ</text>
    <text x="100" y="45" text-anchor="middle" font-family="Monaco, monospace" font-size="10" fill="rgba(255,255,255,0.8)">Message Broker</text>
  </g>
  
  <!-- Orchestrator -->
  <g transform="translate(300, 250)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="url(#orchestratorGradient)" filter="url(#glow)"/>
    <text x="100" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">🎯 Saga Orchestrator</text>
    <text x="100" y="45" text-anchor="middle" font-family="Monaco, monospace" font-size="10" fill="rgba(255,255,255,0.8)">State Machine</text>
    <text x="100" y="60" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.6)">+ SQL Server</text>
  </g>
  
  <!-- Domain Services -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="url(#serviceGradient)"/>
    <text x="70" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">📦 Stock Service</text>
    <text x="70" y="45" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Reserve / Release</text>
  </g>
  
  <g transform="translate(330, 360)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="url(#serviceGradient)"/>
    <text x="70" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">💳 Payment Service</text>
    <text x="70" y="45" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Process / Refund</text>
  </g>
  
  <g transform="translate(610, 360)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="url(#serviceGradient)"/>
    <text x="70" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">🚚 Shipping Service</text>
    <text x="70" y="45" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Arrange / Cancel</text>
  </g>
  
  <!-- Connection Lines -->
  <!-- API to Broker -->
  <path d="M 400 110 L 400 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Broker to Orchestrator -->
  <path d="M 400 210 L 400 250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Orchestrator to Services via Broker -->
  <path d="M 300 285 L 120 285 L 120 360" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <path d="M 400 320 L 400 360" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <path d="M 500 285 L 680 285 L 680 360" stroke="#06b6d4" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <g transform="translate(600, 60)">
    <rect x="0" y="0" width="170" height="80" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="85" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">COMMUNICATION</text>
    <line x1="15" y1="35" x2="50" y2="35" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="39" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">HTTP / Direct</text>
    <line x1="15" y1="55" x2="50" y2="55" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="60" y="59" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Async Messages</text>
  </g>
</svg>

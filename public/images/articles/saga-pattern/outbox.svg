<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    
    <linearGradient id="outboxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    
    <linearGradient id="brokerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <linearGradient id="processGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
    
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#10b981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="url(#bgGradient)"/>
  
  <!-- Grid -->
  <g opacity="0.03">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="350" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Outbox Pattern: Atomic State + Message Delivery</text>
  
  <!-- Transaction Boundary Box -->
  <rect x="50" y="70" width="380" height="220" rx="10" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="240" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06b6d4">📦 Same Database Transaction</text>
  
  <!-- Step 1: Service -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="url(#processGradient)" filter="url(#glow)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Orchestrator</text>
    <text x="65" y="42" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Update State</text>
    <circle cx="-20" cy="30" r="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="-20" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b5cf6">1</text>
  </g>
  
  <!-- Step 2: Saga State Table -->
  <g transform="translate(260, 120)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="url(#dbGradient)" filter="url(#glow)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Saga State</text>
    <text x="65" y="42" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">SQL Table</text>
    <circle cx="-20" cy="30" r="15" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="-20" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#06b6d4">2</text>
  </g>
  
  <!-- Step 3: Outbox Table -->
  <g transform="translate(170, 210)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="url(#outboxGradient)" filter="url(#glow)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Outbox Table</text>
    <text x="65" y="42" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Pending Messages</text>
    <circle cx="-20" cy="30" r="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="-20" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">3</text>
  </g>
  
  <!-- Arrows within transaction -->
  <path d="M 210 150 L 255 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 325 180 L 325 205 L 305 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Outside Transaction -->
  <!-- Background Process -->
  <g transform="translate(480, 145)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="url(#processGradient)" filter="url(#glow)"/>
    <text x="65" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Background</text>
    <text x="65" y="42" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Message Relay</text>
    <circle cx="-20" cy="30" r="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="-20" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b5cf6">4</text>
  </g>
  
  <!-- Message Broker -->
  <g transform="translate(660, 145)">
    <rect x="0" y="0" width="110" height="60" rx="8" fill="url(#brokerGradient)" filter="url(#glow)"/>
    <text x="55" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">🐰 RabbitMQ</text>
    <text x="55" y="42" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Broker</text>
    <circle cx="-20" cy="30" r="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="-20" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">5</text>
  </g>
  
  <!-- Outbox to Background -->
  <path d="M 300 240 L 400 240 L 400 175 L 475 175" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="370" y="220" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="#64748b">Poll &amp; Fetch</text>
  
  <!-- Background to Broker -->
  <path d="M 610 175 L 655 175" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="632" y="165" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="#64748b">Publish</text>
  
  <!-- Explanation -->
  <g transform="translate(500, 240)">
    <rect x="0" y="0" width="270" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="135" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">GUARANTEE</text>
    <text x="135" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">State change and message write are atomic.</text>
    <text x="135" y="53" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">If broker is down, messages wait in outbox</text>
    <text x="135" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">→ Exactly-once delivery semantics</text>
  </g>
</svg>

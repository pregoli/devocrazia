<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <linearGradient id="anaemicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    
    <linearGradient id="richGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    
    <linearGradient id="behaviourGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid -->
  <g opacity="0.03">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Rich vs Anaemic Domain Models</text>
  
  <!-- Anaemic Side -->
  <g transform="translate(50, 60)">
    <!-- Header -->
    <rect x="0" y="0" width="300" height="40" rx="8" fill="url(#anaemicGradient)" filter="url(#glow)"/>
    <text x="150" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">❌ Anaemic Model</text>
    
    <!-- Data Container -->
    <rect x="60" y="60" width="180" height="120" rx="8" fill="url(#dataGradient)" opacity="0.9"/>
    <text x="150" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">📦 Order</text>
    <text x="150" y="105" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Id: Guid</text>
    <text x="150" y="120" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Status: string</text>
    <text x="150" y="135" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Total: decimal</text>
    <text x="150" y="150" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="rgba(255,255,255,0.8)">Lines: List&lt;&gt;</text>
    <text x="150" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" font-style="italic">Data only</text>
    
    <!-- External Services -->
    <rect x="0" y="200" width="140" height="70" rx="8" fill="url(#serviceGradient)" opacity="0.9"/>
    <text x="70" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">OrderService</text>
    <text x="70" y="245" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Ship()</text>
    <text x="70" y="258" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">AddLine()</text>
    
    <rect x="160" y="200" width="140" height="70" rx="8" fill="url(#serviceGradient)" opacity="0.9"/>
    <text x="230" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">ValidationService</text>
    <text x="230" y="245" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">ValidateOrder()</text>
    <text x="230" y="258" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">CheckStatus()</text>
    
    <!-- Problem callout -->
    <text x="150" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">Logic scattered everywhere!</text>
  </g>
  
  <!-- Divider -->
  <line x1="400" y1="70" x2="400" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">VS</text>
  
  <!-- Rich Side -->
  <g transform="translate(450, 60)">
    <!-- Header -->
    <rect x="0" y="0" width="300" height="40" rx="8" fill="url(#richGradient)" filter="url(#glow)"/>
    <text x="150" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">✅ Rich Model</text>
    
    <!-- Combined Entity -->
    <rect x="30" y="60" width="240" height="200" rx="8" fill="url(#dataGradient)" filter="url(#glow)"/>
    <text x="150" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">📦 Order (Aggregate Root)</text>
    
    <!-- Data Section -->
    <rect x="45" y="100" width="210" height="60" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="150" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.9)">DATA</text>
    <text x="150" y="132" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.7)">OrderId Id { get; }</text>
    <text x="150" y="145" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.7)">Money TotalAmount { get; }</text>
    
    <!-- Behaviour Section -->
    <rect x="45" y="170" width="210" height="75" rx="4" fill="url(#behaviourGradient)" opacity="0.7"/>
    <text x="150" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">BEHAVIOUR</text>
    <text x="150" y="202" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.9)">AddLine(product, qty, price)</text>
    <text x="150" y="215" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.9)">Submit()</text>
    <text x="150" y="228" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.9)">Ship(trackingNumber)</text>
    <text x="150" y="241" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.9)">Cancel(reason)</text>
    
    <!-- Success callout -->
    <text x="150" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e">Data + Behaviour together!</text>
    <text x="150" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Enforces its own invariants</text>
  </g>
</svg>

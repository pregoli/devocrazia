<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <linearGradient id="valueObjectGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    
    <linearGradient id="propertyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    
    <linearGradient id="emailGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    
    <linearGradient id="moneyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <linearGradient id="quantityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="url(#bgGradient)"/>
  
  <!-- Grid -->
  <g opacity="0.03">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="350" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Value Object Characteristics</text>
  
  <!-- Central concept -->
  <g transform="translate(300, 60)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="url(#valueObjectGradient)" filter="url(#glow)"/>
    <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">Value Object</text>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Defined by attributes, not identity</text>
  </g>
  
  <!-- Properties radiating out -->
  <!-- Immutable -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#propertyGradient)"/>
    <text x="75" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">🔒 Immutable</text>
    <text x="75" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Once created,</text>
    <text x="75" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">cannot be changed</text>
  </g>
  
  <!-- Self-validating -->
  <g transform="translate(220, 150)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#propertyGradient)"/>
    <text x="75" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">✅ Self-Validating</text>
    <text x="75" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Invalid values cannot</text>
    <text x="75" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">be constructed</text>
  </g>
  
  <!-- Equality by value -->
  <g transform="translate(390, 150)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#propertyGradient)"/>
    <text x="75" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">⚖️ Value Equality</text>
    <text x="75" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Two objects equal</text>
    <text x="75" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">if attributes match</text>
  </g>
  
  <!-- Replaceability -->
  <g transform="translate(560, 150)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="url(#propertyGradient)"/>
    <text x="75" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">🔄 Replaceable</text>
    <text x="75" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Can be substituted</text>
    <text x="75" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">with equal values</text>
  </g>
  
  <!-- Examples -->
  <text x="400" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">EXAMPLES</text>
  
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="130" height="55" rx="6" fill="url(#emailGradient)"/>
    <text x="65" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">📧 Email</text>
    <text x="65" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Validates format</text>
    <text x="65" y="50" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Normalises case</text>
  </g>
  
  <g transform="translate(230, 270)">
    <rect x="0" y="0" width="130" height="55" rx="6" fill="url(#moneyGradient)"/>
    <text x="65" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">💰 Money</text>
    <text x="65" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Amount + Currency</text>
    <text x="65" y="50" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Prevents mixing</text>
  </g>
  
  <g transform="translate(380, 270)">
    <rect x="0" y="0" width="130" height="55" rx="6" fill="url(#quantityGradient)"/>
    <text x="65" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">📊 Quantity</text>
    <text x="65" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Always positive</text>
    <text x="65" y="50" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Integer only</text>
  </g>
  
  <g transform="translate(530, 270)">
    <rect x="0" y="0" width="130" height="55" rx="6" fill="url(#valueObjectGradient)"/>
    <text x="65" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">📍 Address</text>
    <text x="65" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Street, City, Post</text>
    <text x="65" y="50" text-anchor="middle" font-family="Monaco, monospace" font-size="8" fill="rgba(255,255,255,0.8)">Validates together</text>
  </g>
</svg>

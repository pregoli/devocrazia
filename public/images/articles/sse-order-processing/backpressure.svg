<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
    
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ef4444"/>
    </marker>
    
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#22c55e"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid -->
  <g opacity="0.03">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Backpressure with Bounded Channels</text>
  
  <!-- Publisher -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#3b82f6" filter="url(#glow)"/>
    <text x="70" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="white">📤 Publisher</text>
    <text x="70" y="50" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">OrderEventHub</text>
    <text x="70" y="65" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">High throughput</text>
  </g>
  
  <!-- Bounded Channel -->
  <g transform="translate(280, 60)">
    <rect x="0" y="0" width="240" height="120" rx="10" fill="#06b6d4" filter="url(#glow)"/>
    <text x="120" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="white">📦 Bounded Channel</text>
    <text x="120" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)">Capacity: 100</text>
    
    <!-- Buffer visualization -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="200" height="40" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)"/>
      
      <!-- Events in buffer -->
      <rect x="5" y="5" width="25" height="30" rx="3" fill="#22c55e"/>
      <rect x="35" y="5" width="25" height="30" rx="3" fill="#22c55e"/>
      <rect x="65" y="5" width="25" height="30" rx="3" fill="#22c55e"/>
      <rect x="95" y="5" width="25" height="30" rx="3" fill="#22c55e"/>
      <rect x="125" y="5" width="25" height="30" rx="3" fill="#22c55e" opacity="0.6"/>
      <rect x="155" y="5" width="25" height="30" rx="3" fill="transparent" stroke="#64748b" stroke-dasharray="3,2"/>
      
      <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">Events queued</text>
    </g>
  </g>
  
  <!-- Slow Consumer -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#8b5cf6" filter="url(#glow)"/>
    <text x="70" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="white">🐢 Consumer</text>
    <text x="70" y="50" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">Browser (slow)</text>
    <text x="70" y="65" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Poor connection</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 190 120 L 280 120" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="235" y="110" font-family="monospace" font-size="8" fill="#22c55e">fast</text>
  
  <path d="M 520 120 L 610 120" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="565" y="110" font-family="monospace" font-size="8" fill="#f59e0b">slow</text>
  
  <!-- What happens when full -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="700" height="140" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">WHEN BUFFER IS FULL</text>
    
    <!-- DropOldest strategy -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="300" height="70" rx="8" fill="#22c55e" opacity="0.2"/>
      <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22c55e">✅ DropOldest (Our Choice)</text>
      <text x="150" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">New events push out oldest</text>
      <text x="150" y="60" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Server stays healthy</text>
    </g>
    
    <!-- Alternative -->
    <g transform="translate(370, 50)">
      <rect x="0" y="0" width="300" height="70" rx="8" fill="#ef4444" opacity="0.2"/>
      <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444">❌ Unbounded Alternative</text>
      <text x="150" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Memory grows indefinitely</text>
      <text x="150" y="60" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Server crashes</text>
    </g>
  </g>
</svg>

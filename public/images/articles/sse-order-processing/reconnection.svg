<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b"/>
    </marker>
    
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#22c55e"/>
    </marker>
    
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>
  
  <!-- Grid -->
  <g opacity="0.03">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Automatic Reconnection with Last-Event-ID</text>
  
  <!-- Timeline header -->
  <text x="100" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Browser</text>
  <text x="700" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Server</text>
  
  <!-- Vertical lines -->
  <line x1="100" y1="85" x2="100" y2="420" stroke="#334155" stroke-width="2"/>
  <line x1="700" y1="85" x2="700" y2="420" stroke="#334155" stroke-width="2"/>
  
  <!-- Step 1: Initial connection -->
  <g transform="translate(0, 90)">
    <text x="30" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22c55e">1</text>
    <path d="M 100 10 L 700 10" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
    <text x="400" y="5" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">GET /stream (EventSource connects)</text>
  </g>
  
  <!-- Step 2: Events flowing -->
  <g transform="translate(0, 130)">
    <text x="30" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3b82f6">2</text>
    <path d="M 700 10 L 100 10" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="300" y="-5" width="200" height="30" rx="4" fill="#1e293b"/>
    <text x="400" y="15" text-anchor="middle" font-family="monospace" font-size="9" fill="#3b82f6">event: OrderPaid (id: 3)</text>
  </g>
  
  <g transform="translate(0, 170)">
    <path d="M 700 10 L 100 10" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="300" y="-5" width="200" height="30" rx="4" fill="#1e293b"/>
    <text x="400" y="15" text-anchor="middle" font-family="monospace" font-size="9" fill="#3b82f6">event: OrderShipped (id: 4)</text>
  </g>
  
  <!-- Step 3: Connection drops -->
  <g transform="translate(0, 220)">
    <text x="30" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ef4444">3</text>
    <line x1="100" y1="10" x2="700" y2="10" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
    <rect x="320" y="-5" width="160" height="30" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="400" y="15" text-anchor="middle" font-family="monospace" font-size="9" fill="#ef4444">❌ Connection dropped</text>
    
    <!-- Missed event -->
    <rect x="600" y="30" width="180" height="25" rx="4" fill="#f59e0b" opacity="0.3"/>
    <text x="690" y="47" text-anchor="middle" font-family="monospace" font-size="8" fill="#f59e0b">event: id:5 (missed)</text>
  </g>
  
  <!-- Step 4: Auto-reconnect -->
  <g transform="translate(0, 290)">
    <text x="30" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22c55e">4</text>
    <path d="M 100 10 L 700 10" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
    <rect x="250" y="-5" width="300" height="30" rx="4" fill="#22c55e" opacity="0.2"/>
    <text x="400" y="15" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">GET /stream + Last-Event-ID: 4</text>
    
    <!-- Browser note -->
    <rect x="20" y="35" width="160" height="40" rx="4" fill="#1e293b"/>
    <text x="100" y="52" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">Browser waits 3s</text>
    <text x="100" y="65" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">then auto-reconnects</text>
  </g>
  
  <!-- Step 5: Replay missed events -->
  <g transform="translate(0, 360)">
    <text x="30" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b5cf6">5</text>
    <path d="M 700 10 L 100 10" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="280" y="-5" width="240" height="30" rx="4" fill="#8b5cf6" opacity="0.3"/>
    <text x="400" y="15" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b5cf6">Replay: OrderInvoiced (id: 5)</text>
    
    <!-- Server note -->
    <rect x="620" y="35" width="160" height="40" rx="4" fill="#1e293b"/>
    <text x="700" y="52" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">Server replays events</text>
    <text x="700" y="65" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">after id: 4</text>
  </g>
  
  <!-- Key takeaway -->
  <rect x="200" y="410" width="400" height="30" rx="6" fill="#22c55e" opacity="0.15"/>
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#22c55e">✅ No client-side reconnection logic required — browser handles it!</text>
</svg>

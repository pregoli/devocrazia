<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid -->
  <g opacity="0.03">
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="400" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="white">Server-Sent Events</text>
  <text x="200" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Real-Time in .NET 10</text>
  
  <!-- Server -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="140" height="110" rx="10" fill="#3b82f6" filter="url(#glow)"/>
    <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white">🖥️ Server</text>
    
    <rect x="12" y="38" width="116" height="28" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text x="70" y="56" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.9)">Order Aggregate</text>
    
    <rect x="12" y="72" width="116" height="28" rx="5" fill="#22c55e"/>
    <text x="70" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="white">SSE Endpoint</text>
  </g>
  
  <!-- Browser -->
  <g transform="translate(230, 70)">
    <rect x="0" y="0" width="140" height="110" rx="10" fill="#8b5cf6" filter="url(#glow)"/>
    <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white">🌐 Browser</text>
    
    <rect x="12" y="38" width="116" height="28" rx="5" fill="rgba(255,255,255,0.15)"/>
    <text x="70" y="56" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.9)">EventSource</text>
    
    <rect x="12" y="72" width="116" height="28" rx="5" fill="#1e293b"/>
    <text x="70" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e">Timeline UI</text>
  </g>
  
  <!-- Stream Arrow -->
  <g transform="translate(100, 200)">
    <rect x="0" y="17" width="200" height="6" rx="3" fill="#22c55e" opacity="0.3"/>
    
    <!-- Event boxes -->
    <rect x="15" y="0" width="50" height="35" rx="5" fill="#22c55e"/>
    <text x="40" y="15" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="white">Paid</text>
    <text x="40" y="27" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.8)">id: 3</text>
    
    <rect x="75" y="0" width="50" height="35" rx="5" fill="#06b6d4"/>
    <text x="100" y="15" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="white">Shipped</text>
    <text x="100" y="27" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.8)">id: 4</text>
    
    <rect x="135" y="0" width="50" height="35" rx="5" fill="#8b5cf6"/>
    <text x="160" y="15" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="white">Done</text>
    <text x="160" y="27" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.8)">id: 5</text>
    
    <!-- Arrow head -->
    <polygon points="195,20 210,20 202,10" fill="#22c55e"/>
    <polygon points="195,20 210,20 202,30" fill="#22c55e"/>
  </g>
  
  <!-- Features -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="150" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">KEY FEATURES</text>
    
    <text x="25" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#22c55e">✓ Auto-reconnect</text>
    <text x="120" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#22c55e">✓ Event replay</text>
    <text x="215" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#22c55e">✓ Backpressure</text>
    
    <text x="25" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#06b6d4">✓ Type-safe</text>
    <text x="120" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#06b6d4">✓ IAsyncEnumerable</text>
    <text x="215" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#06b6d4">✓ Native API</text>
  </g>
  
  <!-- Tags -->
  <g transform="translate(55, 348)">
    <rect x="0" y="0" width="60" height="22" rx="3" fill="#512bd4"/>
    <text x="30" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">.NET 10</text>
  </g>
  
  <g transform="translate(125, 348)">
    <rect x="0" y="0" width="45" height="22" rx="3" fill="#22c55e"/>
    <text x="22" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">SSE</text>
  </g>
  
  <g transform="translate(180, 348)">
    <rect x="0" y="0" width="100" height="22" rx="3" fill="#3b82f6"/>
    <text x="50" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">Clean Arch</text>
  </g>
  
  <g transform="translate(290, 348)">
    <rect x="0" y="0" width="55" height="22" rx="3" fill="#8b5cf6"/>
    <text x="27" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="white">DDD</text>
  </g>
</svg>

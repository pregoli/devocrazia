<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles (no filter) -->
  <circle cx="100" cy="100" r="150" fill="#3b82f6" opacity="0.08"/>
  <circle cx="1100" cy="530" r="200" fill="#8b5cf6" opacity="0.08"/>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Rich Domain Modelling</text>
  <text x="600" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Escaping the Anaemic Model Trap</text>
  
  <!-- Main visual: Rich Model Entity -->
  <g transform="translate(350, 180)">
    <!-- Aggregate boundary -->
    <rect x="0" y="0" width="500" height="350" rx="20" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="12,6" opacity="0.6"/>
    <text x="250" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#22c55e">AGGREGATE BOUNDARY</text>
    
    <!-- Rich Entity -->
    <g transform="translate(100, 50)">
      <rect x="0" y="0" width="300" height="200" rx="12" fill="#3b82f6"/>
      <text x="150" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">📦 Order</text>
      <text x="150" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">AGGREGATE ROOT</text>
      
      <!-- Data section -->
      <rect x="20" y="70" width="260" height="50" rx="6" fill="rgba(255,255,255,0.1)"/>
      <text x="150" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.9)">DATA</text>
      <text x="150" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.7)">OrderId Id • Money Total • OrderStatus Status</text>
      
      <!-- Behaviour section -->
      <rect x="20" y="130" width="260" height="55" rx="6" fill="#06b6d4" opacity="0.9"/>
      <text x="150" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="white">BEHAVIOUR</text>
      <text x="150" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.9)">AddLine() • Submit() • Ship() • Cancel()</text>
      <text x="150" y="180" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.7)">Enforces invariants internally</text>
    </g>
    
    <!-- Value Objects -->
    <rect x="50" y="270" width="100" height="50" rx="8" fill="#8b5cf6"/>
    <text x="100" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">💰 Money</text>
    <text x="100" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">Value Object</text>
    
    <rect x="170" y="270" width="100" height="50" rx="8" fill="#8b5cf6"/>
    <text x="220" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">📧 Email</text>
    <text x="220" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">Value Object</text>
    
    <rect x="290" y="270" width="100" height="50" rx="8" fill="#8b5cf6"/>
    <text x="340" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">📊 Quantity</text>
    <text x="340" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">Value Object</text>
  </g>
  
  <!-- Left side: Anaemic crossed out -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#ef4444" opacity="0.2"/>
    <text x="90" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444">❌ Anaemic</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.7)">Data only</text>
    <text x="90" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.7)">Logic scattered</text>
    <text x="90" y="85" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.7)">No encapsulation</text>
    <line x1="0" y1="0" x2="180" y2="100" stroke="#ef4444" stroke-width="3" opacity="0.5"/>
    <line x1="180" y1="0" x2="0" y2="100" stroke="#ef4444" stroke-width="3" opacity="0.5"/>
  </g>
  
  <!-- Right side: Rich model benefits -->
  <g transform="translate(970, 280)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#22c55e" opacity="0.2"/>
    <text x="90" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22c55e">✅ Rich Model</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(34,197,94,0.9)">Data + Behaviour</text>
    <text x="90" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(34,197,94,0.9)">Self-validating</text>
    <text x="90" y="85" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(34,197,94,0.9)">Encapsulated</text>
  </g>
  
  <!-- Tech badges -->
  <rect x="300" y="560" width="80" height="30" rx="4" fill="#22c55e"/>
  <text x="340" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">C#</text>
  
  <rect x="400" y="560" width="80" height="30" rx="4" fill="#8b5cf6"/>
  <text x="440" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">DDD</text>
  
  <rect x="500" y="560" width="130" height="30" rx="4" fill="#3b82f6"/>
  <text x="565" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Value Objects</text>
  
  <rect x="650" y="560" width="110" height="30" rx="4" fill="#06b6d4"/>
  <text x="705" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Aggregates</text>
  
  <rect x="780" y="560" width="120" height="30" rx="4" fill="#f59e0b"/>
  <text x="840" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Clean Code</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#3b82f6" opacity="0.08"/>
  <circle cx="1100" cy="530" r="200" fill="#22c55e" opacity="0.08"/>
  
  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Server-Sent Events in .NET 10</text>
  <text x="600" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Real-Time Order Processing with Clean Architecture</text>
  
  <!-- Main visual: Server to Browser flow -->
  <g transform="translate(100, 170)">
    
    <!-- Server Box -->
    <rect x="0" y="0" width="320" height="320" rx="16" fill="#3b82f6"/>
    <text x="160" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">🖥️ .NET 10 Server</text>
    
    <!-- Domain Layer -->
    <rect x="20" y="60" width="280" height="75" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="160" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">Domain Layer</text>
    <text x="160" y="105" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)">Order Aggregate → Domain Events</text>
    <text x="160" y="122" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.6)">State Machine Transitions</text>
    
    <!-- Infrastructure -->
    <rect x="20" y="145" width="280" height="75" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="160" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">Infrastructure</text>
    <text x="160" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)">OrderEventHub</text>
    <text x="160" y="207" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.6)">Channels • Backpressure • Replay</text>
    
    <!-- SSE Endpoint -->
    <rect x="20" y="230" width="280" height="70" rx="8" fill="#22c55e"/>
    <text x="160" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">SSE Endpoint</text>
    <text x="160" y="280" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.9)">TypedResults.ServerSentEvents()</text>
  </g>
  
  <!-- Stream visualization -->
  <g transform="translate(420, 280)">
    <!-- Stream line -->
    <rect x="0" y="48" width="360" height="10" rx="5" fill="#22c55e" opacity="0.2"/>
    
    <!-- Event packets flowing -->
    <rect x="20" y="30" width="90" height="45" rx="8" fill="#22c55e"/>
    <text x="65" y="50" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="white">OrderPaid</text>
    <text x="65" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">id: 3</text>
    
    <rect x="130" y="30" width="90" height="45" rx="8" fill="#06b6d4"/>
    <text x="175" y="50" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="white">OrderShipped</text>
    <text x="175" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">id: 4</text>
    
    <rect x="240" y="30" width="90" height="45" rx="8" fill="#8b5cf6"/>
    <text x="285" y="50" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="white">OrderDone</text>
    <text x="285" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">id: 5</text>
    
    <!-- Arrow -->
    <polygon points="350,53 380,53 365,35" fill="#22c55e"/>
    <polygon points="350,53 380,53 365,71" fill="#22c55e"/>
  </g>
  
  <!-- Browser Box -->
  <g transform="translate(780, 170)">
    <rect x="0" y="0" width="320" height="320" rx="16" fill="#8b5cf6"/>
    <text x="160" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">🌐 Browser</text>
    
    <!-- EventSource -->
    <rect x="20" y="60" width="280" height="65" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="160" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">EventSource API</text>
    <text x="160" y="108" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)">Auto-reconnect • Last-Event-ID</text>
    
    <!-- Timeline UI -->
    <rect x="20" y="135" width="280" height="165" rx="8" fill="#1e293b"/>
    <text x="160" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ORDER TIMELINE</text>
    
    <!-- Timeline items -->
    <circle cx="50" cy="190" r="10" fill="#22c55e"/>
    <text x="75" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">Submitted ✓</text>
    
    <circle cx="50" cy="220" r="10" fill="#22c55e"/>
    <text x="75" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">Validated ✓</text>
    
    <circle cx="50" cy="250" r="10" fill="#22c55e"/>
    <text x="75" y="255" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">Paid ✓</text>
    
    <circle cx="50" cy="280" r="10" fill="#3b82f6"/>
    <text x="75" y="285" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6">Shipped...</text>
  </g>
  
  <!-- Tech badges -->
  <rect x="280" y="560" width="90" height="30" rx="4" fill="#512bd4"/>
  <text x="325" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">.NET 10</text>
  
  <rect x="390" y="560" width="70" height="30" rx="4" fill="#22c55e"/>
  <text x="425" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">SSE</text>
  
  <rect x="480" y="560" width="140" height="30" rx="4" fill="#3b82f6"/>
  <text x="550" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Clean Architecture</text>
  
  <rect x="640" y="560" width="70" height="30" rx="4" fill="#8b5cf6"/>
  <text x="675" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">DDD</text>
  
  <rect x="730" y="560" width="100" height="30" rx="4" fill="#06b6d4"/>
  <text x="780" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Real-Time</text>
</svg>

name: Tests

# `test` is a required status check on main, so it must report on every PR. Changes that only
# touch Claude Code config or root docs skip its steps instead of skipping the workflow: a job
# skipped by `if:` counts as passed, while a workflow skipped by `paths-ignore` never reports
# and leaves the PR waiting forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Fail safe: if the diff can't be computed (e.g. the first push of a branch), run the tests.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              ''|.claude/*|CLAUDE.md|README.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "Changed files:"; echo "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Also runs if `changes` failed: a skipped `test` counts as passed, so a broken detector must not skip it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

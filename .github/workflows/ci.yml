name: Tests

# Skip CI when a change only touches Claude Code config or root docs.
# Root .md files are listed by name: article content in public/content/articles/*.md must still run CI.
on:
  push:
    branches: [main]
    paths-ignore: ['.claude/**', 'CLAUDE.md', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['.claude/**', 'CLAUDE.md', 'README.md']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
